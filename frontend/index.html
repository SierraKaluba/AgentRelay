<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10131b" />
  <title>AgentRelay — Dashboard</title>
  <style>
    :root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--line:#2b3342;--muted:#9aa5b5;--text:#edf1f7;--green:#73e0b2;--blue:#8bb8ff;--red:#ff8d99}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#263b4a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #465267;background:#263143;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650}button:hover{filter:brightness(1.15)}button.primary{background:var(--green);border-color:var(--green);color:#101c19}button.ghost{background:transparent}button.danger{color:var(--red)}.wrap{max-width:1120px;margin:auto;padding:32px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#73e0b2,#8bb8ff);display:grid;place-items:center;color:#13221d;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);border-radius:30px;padding:6px 11px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:17px}.card{background:linear-gradient(150deg,rgba(29,35,48,.96),rgba(22,27,38,.98));border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 15px 40px #0002}.card h2{font-size:15px;margin:0 0 15px}.span{grid-column:1/-1}.form{display:flex;gap:10px}.form input{flex:1;min-width:0}.input,textarea{width:100%;background:#111721;border:1px solid #364052;color:var(--text);border-radius:9px;padding:11px 12px;outline:none}.input:focus,textarea:focus{border-color:var(--blue)}.toggle{display:flex;background:#111721;border:1px solid #30394a;border-radius:9px;padding:3px}.toggle button{border:0;background:none;color:var(--muted);padding:7px 10px}.toggle button.selected{background:#303b4c;color:var(--text)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:12px}.task{border-left:3px solid var(--green);padding:11px 14px;background:#101721;border-radius:0 9px 9px 0}.task strong{display:block;margin-bottom:5px}.agent-list{display:grid;gap:9px}.agent{padding:12px;border:1px solid var(--line);border-radius:10px;background:#141a24}.agent-name{font-weight:700}.dot{display:inline-block;width:8px;height:8px;background:#7c8799;border-radius:50%;margin-right:7px}.dot.active{background:var(--green);box-shadow:0 0 10px #73e0b288}.event{padding:10px 0;border-bottom:1px solid #293140}.event:last-child{border:0}.event-head{display:flex;justify-content:space-between;gap:10px}.event-type{font-size:12px;color:var(--blue);font-weight:700}.reason{margin-top:3px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.empty{color:var(--muted);padding:15px 0;text-align:center}.feedback{min-height:22px;color:var(--red);font-size:13px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.span{grid-column:auto}.top{align-items:flex-start}.form{flex-wrap:wrap}.form input{flex-basis:100%}.wrap{padding:20px 14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><div class="mark">A</div><div><h1>AgentRelay</h1><p>Orchestration claire, contexte partagé.</p></div></div><div class="row"><span id="connection" class="pill">Connexion…</span></div></header>
    <section class="card" style="margin-bottom:17px"><div class="row" style="margin-bottom:12px"><div><h2 style="margin:0 0 3px">Nouvelle session</h2><div class="muted small">Gemma choisit l’agent et prépare son contexte.</div></div><div class="toggle"><button id="manual" class="selected" type="button">Manuel</button><button id="auto" type="button">Auto</button></div></div><form id="startForm" class="form"><input id="goal" class="input" placeholder="Ex. Ajouter une authentification JWT" required/><button class="primary">Démarrer</button></form><div id="feedback" class="feedback"></div></section>
    <div class="layout">
      <section class="card"><div class="row"><h2>Session</h2><span id="status" class="pill">Inactif</span></div><div id="session"><div class="empty">Démarre une session pour voir les étapes ici.</div></div></section>
      <section class="card"><div class="row"><h2>Agents configurés</h2></div><div id="agents" class="agent-list"><div class="empty">Chargement…</div></div></section>
      <section class="card span"><div class="row"><h2>Activité récente</h2><button id="refresh" class="ghost small" type="button">Actualiser</button></div><div id="activity"></div></section>
    </div>
  </main>
<script>
const $=id=>document.getElementById(id);let mode='manual';let busy=false;
function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,body){const response=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Erreur API');return data}
function setFeedback(message=''){ $('feedback').textContent=message }
async function act(path,body){if(busy)return;busy=true;setFeedback('');try{await api(path,body);await refresh()}catch(e){setFeedback(e.message)}finally{busy=false}}
function render(data){$('connection').textContent='API connectée';const s=data.session;
 $('agents').innerHTML=data.agents.length?data.agents.map(a=>`<div class="agent"><div class="row"><span class="agent-name"><i class="dot ${a.status==='active'?'active':''}"></i>${escapeHtml(a.name)}</span>${s&&s.current_agent!==a.name&&s.status!=='done'?`<button class="ghost small" data-takeover="${escapeHtml(a.name)}">Prendre la main</button>`:''}</div><div class="muted small" style="margin:5px 0 0 15px">${escapeHtml(a.description)}</div></div>`).join(''):'<div class="empty">Aucun agent configuré.</div>';
 if(!s){$('status').textContent='Inactif';$('session').innerHTML='<div class="empty">Démarre une session pour voir les étapes ici.</div>'}else{$('status').textContent=s.status==='waiting'?'En attente':s.status==='running'?'En cours':s.status==='done'?'Terminée':s.status;const current=s.current_task?`<div class="task"><strong>${escapeHtml(s.current_agent)} · tâche en cours</strong>${escapeHtml(s.current_task)}<div class="muted small" style="margin-top:6px">${escapeHtml(s.last_decision?.reason||'')}</div></div>`:'<div class="empty">Aucune tâche en cours.</div>';const steps=(s.steps||[]).map((x,i)=>`<div class="event"><div class="event-head"><span class="event-type">${i+1}. ${escapeHtml(x.agent)}</span><span class="muted small">${x.finished_at?'Terminée':'En cours'}</span></div><div class="reason">${escapeHtml(x.task)}</div>${x.output?`<div class="reason">Résultat : ${escapeHtml(x.output)}</div>`:''}</div>`).join('');const controls=s.status==='waiting'?'<div class="actions" style="margin-top:15px"><button id="nextBtn" class="primary">Terminer l’étape et continuer</button></div>':'';$('session').innerHTML=`<div class="muted small" style="margin-bottom:12px">Objectif · ${escapeHtml(s.goal)} · ${escapeHtml(s.mode)}</div>${current}${steps?`<div style="margin-top:14px">${steps}</div>`:''}<div id="outputArea" class="hide" style="margin-top:12px"><textarea id="outputText" rows="3" placeholder="Résumé du travail réalisé par l’agent"></textarea><div class="actions" style="margin-top:8px"><button id="submitNext" class="primary">Continuer</button><button id="cancelNext" class="ghost">Annuler</button></div></div>${controls}${s.error?`<div class="feedback">${escapeHtml(s.error)}</div>`:''}`;
 const next=$('nextBtn');if(next)next.onclick=()=>{$('outputArea').classList.remove('hide');$('outputText').focus()};const submit=$('submitNext');if(submit)submit.onclick=()=>act('/next',{output:$('outputText').value});const cancel=$('cancelNext');if(cancel)cancel.onclick=()=>$('outputArea').classList.add('hide');}
 $('activity').innerHTML=data.activity.length?data.activity.slice(0,12).map(e=>`<div class="event"><div class="event-head"><span class="event-type">${escapeHtml(e.event)}${e.agent?' · '+escapeHtml(e.agent):''}</span><span class="muted small">${escapeHtml(new Date(e.timestamp).toLocaleTimeString())}</span></div><div class="reason">${escapeHtml(e.detail)}</div></div>`).join(''):'<div class="empty">L’activité apparaîtra ici.</div>';
 document.querySelectorAll('[data-takeover]').forEach(b=>b.onclick=()=>act('/takeover/'+encodeURIComponent(b.dataset.takeover),{}));}
async function refresh(){try{render(await api('/status'))}catch(e){$('connection').textContent='API indisponible';$('connection').style.color='var(--red)'}}
$('manual').onclick=()=>{mode='manual';$('manual').classList.add('selected');$('auto').classList.remove('selected')};$('auto').onclick=()=>{mode='auto';$('auto').classList.add('selected');$('manual').classList.remove('selected')};$('startForm').onsubmit=e=>{e.preventDefault();act('/start',{goal:$('goal').value,auto:mode==='auto'}).then(()=>{$('goal').value=''})};$('refresh').onclick=refresh;refresh();setInterval(refresh,2500);
</script>
</body>
</html>
