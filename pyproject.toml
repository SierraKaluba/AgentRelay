[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrelay"
version = "0.1.0"
description = "Coordinate coding agents while preserving project context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agentrelay = "agentrelay.cli:main"

[tool.setuptools.packages.find]
include = ["agentrelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
